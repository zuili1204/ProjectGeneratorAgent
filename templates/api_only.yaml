# 纯后端 API 工作流模板
# 适用于：REST API 服务 / 后端微服务 / 无前端的接口层
# 不含前端代码生成，dev-code 只产出 backend/

name: 纯后端 API 生成
template_key: api_only
pipeline_skill: dev-requirement

default_project_type: backend_only

sub_steps:
  - skill_name: dev-requirement
    display_name: 需求分析
    has_checkpoint: true
    checkpoint_type: approve
    primary_output: REQUIREMENT.md
    min_size: 200
    required_companions: []

  - skill_name: dev-design
    display_name: 系统设计
    has_checkpoint: true
    checkpoint_type: feedback
    primary_output: DESIGN.md
    min_size: 500
    required_companions: []

  - skill_name: dev-code
    display_name: 编码实现
    has_checkpoint: true
    checkpoint_type: approve
    primary_output: RUN.md
    min_size: 100
    required_companions_dynamic: true   # backend_only 只需 code/backend/main.py + RUN.md

  # 可选评审：默认关闭，params 里 enable_review=true 才启用
  - skill_name: dev-review
    display_name: 代码评审
    has_checkpoint: false
    checkpoint_type: null
    primary_output: REVIEW.md
    min_size: 100
    required_companions: []
    when: enable_review == true

  - skill_name: dev-selfcheck
    display_name: 自测验证
    has_checkpoint: false
    checkpoint_type: null
    primary_output: SELF_CHECK.md
    min_size: 100
    required_companions: []
