# 「一句话生成项目」工作流模板
# 对应 Modex-MH-Agent 的 grad_project 模板，简化为明文 YAML 配置

name: 一句话生成项目
template_key: grad_project
pipeline_skill: dev-requirement

# 项目类型影响 dev-code 步骤的健康检查规则
# fullstack: 需要 code/backend/main.py + code/frontend/ + RUN.md
# frontend_only: 只需要 code/ 下有主入口 + RUN.md
# backend_only: 需要 code/backend/main.py + RUN.md
# cli: 需要 code/ 下有主入口 + RUN.md
default_project_type: fullstack

sub_steps:
  - skill_name: dev-requirement
    display_name: 需求分析
    has_checkpoint: true
    checkpoint_type: approve
    primary_output: REQUIREMENT.md
    min_size: 200
    required_companions: []

  - skill_name: dev-design
    display_name: 系统设计
    has_checkpoint: true
    checkpoint_type: feedback
    primary_output: DESIGN.md
    min_size: 500
    required_companions: []

  - skill_name: dev-code
    display_name: 编码实现
    has_checkpoint: true
    checkpoint_type: approve
    primary_output: RUN.md
    min_size: 100
    required_companions_dynamic: true   # 按 project_type 动态决定

  # 可选评审：默认关闭，params 里 enable_review=true 才启用
  # 引入 reviewer 视角打破「自己写自己检」的认知盲区，意见注入 dev-selfcheck 上下文
  - skill_name: dev-review
    display_name: 代码评审
    has_checkpoint: false
    checkpoint_type: null
    primary_output: REVIEW.md
    min_size: 100
    required_companions: []
    when: enable_review == true

  - skill_name: dev-selfcheck
    display_name: 自测验证
    has_checkpoint: false
    checkpoint_type: null
    primary_output: SELF_CHECK.md
    min_size: 100
    required_companions: []
