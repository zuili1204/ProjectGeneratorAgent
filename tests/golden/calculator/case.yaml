# 黄金用例：计算器（frontend_only）
# 用于验证纯前端项目的生成，重点测 fetch 禁令与相对路径约束

name: calculator
description: 纯前端计算器页面（验证 frontend_only 约束）
requirement: "做一个计算器网页，带历史记录功能"
project_type: frontend_only
template: grad_project

steps:
  - skill: dev-requirement
    expected_outputs: [REQUIREMENT.md]
    min_size: 200
    required_sections:
      REQUIREMENT.md:
        - "项目类型"
        - "技术栈"
        - "功能需求"
    assertions:
      project_type_field: frontend_only

  - skill: dev-design
    expected_outputs: [DESIGN.md]
    min_size: 400
    required_sections:
      DESIGN.md:
        - "目录结构"
        - "页面路由"
    assertions:
      no_placeholder_in_tree: true

  - skill: dev-code
    expected_outputs: [code/RUN.md]
    required_files:
      - code/package.json
      - code/RUN.md
    assertions:
      run_md_has_executable_cmd: true
      no_fetch_local_json: true
      no_absolute_asset_path: true

  - skill: dev-selfcheck
    expected_outputs: [SELF_CHECK.md]
