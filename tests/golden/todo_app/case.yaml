# 黄金用例：带登录的待办事项 Web 应用（fullstack）
# 用于 dev-requirement / dev-design / dev-code 的回归测试

name: todo_app
description: 带用户登录的待办事项 Web 应用（全栈典型场景）
requirement: "做一个带用户登录的待办事项 Web 应用，前后端分离"
project_type: fullstack
template: grad_project

steps:
  - skill: dev-requirement
    expected_outputs: [REQUIREMENT.md]
    min_size: 200
    required_sections:
      REQUIREMENT.md:
        - "项目概述"
        - "项目类型"
        - "技术栈"
        - "功能需求"
        - "数据模型概要"
    assertions:
      # project_type 字段必须为 fullstack
      project_type_field: fullstack
      # P0 功能必须非空
      p0_non_empty: true

  - skill: dev-design
    expected_outputs: [DESIGN.md]
    min_size: 500
    required_sections:
      DESIGN.md:
        - "项目概述"
        - "架构图"
        - "目录结构"
        - "数据模型"
        - "技术栈详解"
        - "接口"
    assertions:
      # 目录结构禁止 ... 占位
      no_placeholder_in_tree: true
      # 必须含 Mermaid 或 ASCII 架构图
      has_arch_diagram: true

  - skill: dev-code
    expected_outputs: [code/RUN.md]
    required_files:
      # fullstack 必须有 backend 入口 + frontend package.json
      - code/backend/main.py
      - code/frontend/package.json
      - code/RUN.md
    assertions:
      run_md_has_executable_cmd: true
      no_fetch_local_json: true

  - skill: dev-selfcheck
    expected_outputs: [SELF_CHECK.md]
    required_sections:
      SELF_CHECK.md:
        - "检查概要"
        - "检查项清单"
